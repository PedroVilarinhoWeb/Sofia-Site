<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Sofia Oliveira Academia Estética</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #333;
    }
    header {
      text-align: center;
      padding: 60px 20px;
      background: #f8e8ee;
    }
    header h1 {
      margin: 0;
      font-size: 2.5em;
    }
    header p {
      margin: 10px 0;
    }
    .btn {
      background: #d63384;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      margin-top: 10px;
    }
    section {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }
    h2 {
      color: #d63384;
    }
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .galeria img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #f8e8ee;
    }
  </style>
</head>
<body>

<header>
  <h1>Sofia Oliveira</h1>
  <p>Academia de Estética</p>
  <a class="btn" href="https://instagram.com/sofiaoliveira_academaiestetica" target="_blank">Marcar pelo Instagram</a>
</header>

<section>
  <h2>Sobre</h2>
  <p>Especialistas em estética e formação profissional, focados em realçar a beleza e confiança de cada cliente.</p>
</section>

<section>
  <h2>Galeria</h2>
  <div class="galeria">
  <img src="img1.jpg">
  <img src="img2.jpg">
  <img src="img3.jpg">
  <img src="img4.jpg">
  <img src="img5.jpg">
  <img src="img6.jpg">
  </div>
</section>

<section>
  <h2>Contactos</h2>
  <p>Instagram: @sofiaoliveira_academaiestetica</p>
</section>

<footer>
  <p>© 2026 Sofia Oliveira Academia Estética</p>
</footer>

</body>
</html>
